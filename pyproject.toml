[project]
name = "slm-support-triage"
version = "0.1.0"
description = "Enterprise support-ticket triage: LoRA-tuned small Qwen vs prompted base vs frontier, on a fixed policy."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Lovish Mahajan" }]
# Runtime dependencies are added in the phase that first needs them (plan §6):
# pydantic (Phase 2), rapidfuzz/sentence-transformers/presidio (Phase 2),
# scikit-learn/numpy/pandas (Phase 5), tinker + anthropic/openai (Phase 3/5).
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "training", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
